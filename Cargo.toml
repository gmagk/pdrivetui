[package]
name = "drivetui"
version = "1.0.0-alpha.1"
description = "A TUI for proton-drive cli"
authors = ["gmagk <tbuhtexis@yahoo.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tui-input = "0.15.5"
tui-scrollview = "0.6.8"
clap = { version = "4", features = ["derive"] }
toml = "1.1.6"
strum = "0.26"
strum_macros = "0.26"
url = "2.5.8"
const_format = "0.2"